name: Report Workflow
description: Write a workflow summary and optionally update a pull request comment
inputs:
  title:
    description: Report title
    required: true
  status:
    description: Workflow status to report
    required: true
  commit:
    description: Commit SHA to report
    required: true
  checks:
    description: Markdown rows describing individual check results
    required: false
    default: ""
  health-checks:
    description: Markdown rows describing individual health check results
    required: false
    default: ""
  deployment-links:
    description: Markdown links to include in the pull request report
    required: false
    default: ""
  show-test-summary:
    description: Include the Test Summary/Vitest link and a separate Commit line in the footer
    required: false
    default: "true"
  comment-on-pr:
    description: Comment on the current or associated pull request
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve Test Summary Link
      id: resolve-test-summary
      uses: actions/github-script@v8
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const jobs = await github.paginate(
            github.rest.actions.listJobsForWorkflowRun,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            },
          );
          const testJob = jobs.find((job) =>
            job.name === 'Run Tests' || job.name.endsWith(' / Run Tests')
          );
          const testSummaryUrl = testJob
            ? `${process.env.RUN_URL}#summary-${testJob.id}`
            : process.env.RUN_URL;
          core.setOutput('url', testSummaryUrl);

    - name: Build Report Body
      id: build-report
      shell: bash
      env:
        REPORT_TITLE: ${{ inputs.title }}
        REPORT_STATUS: ${{ inputs.status }}
        REPORT_COMMIT: ${{ inputs.commit }}
        REPORT_CHECKS: ${{ inputs.checks }}
        REPORT_HEALTH_CHECKS: ${{ inputs.health-checks }}
        DEPLOYMENT_LINKS: ${{ inputs.deployment-links }}
        SHOW_TEST_SUMMARY: ${{ inputs.show-test-summary }}
        TEST_SUMMARY_URL: ${{ steps.resolve-test-summary.outputs.url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        EMOJI=":x:"
        if [[ "$REPORT_STATUS" == "success" ]]; then
          EMOJI=":white_check_mark:"
        fi

        {
          echo "## $EMOJI $REPORT_TITLE Summary: \`$REPORT_STATUS\`"
          echo ""
          echo "Commit: $REPORT_COMMIT"
          echo ""
          echo ""
          if [[ -n "$REPORT_CHECKS" ]]; then
            echo "| Check | Result |"
            echo "| --- | --- |"
            printf '%s\n' "$REPORT_CHECKS"
          fi
          if [[ "$SHOW_TEST_SUMMARY" == "true" ]]; then
            echo ""
            echo ""
            echo "Test Summary:"
            echo "[Vitest Test Report]($TEST_SUMMARY_URL)"
          fi
          if [[ -n "$REPORT_HEALTH_CHECKS" ]]; then
            echo ""
            echo ""
            echo "## Health Check"
            echo "| Health Check | Result |"
            echo "| --- | --- |"
            printf '%s\n' "$REPORT_HEALTH_CHECKS"
          fi
          if [[ -n "$DEPLOYMENT_LINKS" ]]; then
            echo ""
            echo ""
            echo "## Deployment"
            echo "| Endpoint | URL |"
            echo "| --- | --- |"
            printf '%s\n' "$DEPLOYMENT_LINKS"
          fi
          echo ""
          echo ""
          echo "[View workflow run]($RUN_URL)"
        } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/report-body.md

        {
          echo "body<<REPORT_BODY_EOF"
          cat /tmp/report-body.md
          echo "REPORT_BODY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: inputs.comment-on-pr == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/github-script@v8
      env:
        REPORT_COMMIT: ${{ inputs.commit }}
        REPORT_BODY: ${{ steps.build-report.outputs.body }}
      with:
        script: |
          let issueNumber = context.issue.number;
          if (context.eventName === 'push') {
            const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.REPORT_COMMIT,
            });
            const pullRequest = associatedPullRequests.find((candidate) => candidate.merged_at) ?? associatedPullRequests[0];
            if (!pullRequest) {
              core.info('No pull request is associated with this deployment commit.');
              return;
            }
            issueNumber = pullRequest.number;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            body: `<!-- workflow-report -->\n${process.env.REPORT_BODY}`,
          });
