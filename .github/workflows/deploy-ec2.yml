name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: deploy-ec2-ssm
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HOST_PORT: "80"
  CONTAINER_PORT: "8080"
  CONTAINER_NAME: dat-freight-demo-go-api

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  build-and-push:
    name: Build and Push Image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Image
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.resolve-endpoint.outputs.api_url }}
      health_json: ${{ steps.verify-health.outputs.health_json }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send Deploy Command to EC2 via SSM
        id: send-command
        timeout-minutes: 10
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'freight' }}
          LOAD_STATS_CACHE_TTL: ${{ vars.LOAD_STATS_CACHE_TTL || '5m' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          GHCR_PAT_B64=$(printf '%s' "${GHCR_PAT}" | base64 | tr -d '\n')
          MONGO_URI_B64=$(printf '%s' "${MONGO_URI}" | base64 | tr -d '\n')
          echo "::add-mask::${GHCR_PAT_B64}"
          echo "::add-mask::${MONGO_URI_B64}"

          PARAMETERS=$(jq -nc \
            --arg ghcr_pat_b64 "${GHCR_PAT_B64}" \
            --arg mongo_uri_b64 "${MONGO_URI_B64}" \
            --arg mongo_db_name "${MONGO_DB_NAME}" \
            --arg stats_cache_ttl "${LOAD_STATS_CACHE_TTL}" \
            --arg cors_allowed_origins "${CORS_ALLOWED_ORIGINS}" \
            --arg image "${IMAGE}" \
            --arg actor "${{ github.actor }}" \
            --arg container_name "${{ env.CONTAINER_NAME }}" \
            --arg host_port "${{ env.HOST_PORT }}" \
            --arg container_port "${{ env.CONTAINER_PORT }}" \
            '{commands: [
              "set -e",
              "if ! command -v docker >/dev/null 2>&1; then sudo apt-get update; sudo apt-get install -y ca-certificates curl gnupg lsb-release; sudo install -m 0755 -d /etc/apt/keyrings; curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg; sudo chmod a+r /etc/apt/keyrings/docker.gpg; echo \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null; sudo apt-get update; sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin; sudo systemctl enable --now docker; fi",
              "GHCR_PAT=$(printf %s \"\($ghcr_pat_b64)\" | base64 -d)",
              "MONGO_URI=$(printf %s \"\($mongo_uri_b64)\" | base64 -d)",
              "DOCKER_CONFIG=$(mktemp -d)",
              "trap \"rm -rf \\\"${DOCKER_CONFIG}\\\"\" EXIT",
              "echo \"${GHCR_PAT}\" | sudo docker --config \"${DOCKER_CONFIG}\" login ghcr.io -u \"\($actor)\" --password-stdin",
              "sudo docker --config \"${DOCKER_CONFIG}\" pull \"\($image)\"",
              "sudo docker stop \"\($container_name)\" || true",
              "sudo docker rm \"\($container_name)\" || true",
              "sudo docker run -d --name \"\($container_name)\" --restart unless-stopped -p \"\($host_port):\($container_port)\" -e PORT=\"\($container_port)\" -e MONGO_URI=\"${MONGO_URI}\" -e MONGO_DB_NAME=\"\($mongo_db_name)\" -e LOAD_STATS_CACHE_TTL=\"\($stats_cache_ttl)\" -e CORS_ALLOWED_ORIGINS=\"\($cors_allowed_origins)\" \"\($image)\"",
              "sudo docker ps --filter \"name=\($container_name)\" --format \"table {{.Names}}\\t{{.Status}}\\t{{.Image}}\""
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for SSM Command Completion
        timeout-minutes: 10
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          if [ -z "${COMMAND_ID}" ] || [ "${COMMAND_ID}" = "None" ]; then
            echo "The SSM send-command call did not return a command ID."
            exit 1
          fi

          WAIT_STATUS=0
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --cli-read-timeout 30 \
            --cli-connect-timeout 30 || WAIT_STATUS=$?

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          exit "${WAIT_STATUS}"

      - name: Resolve Public Endpoint
        id: resolve-endpoint
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set +e

          HOST=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query 'Reservations[0].Instances[0].PublicDnsName' \
            --output text 2>/dev/null)

          if [ -z "${HOST}" ] || [ "${HOST}" = "None" ]; then
            HOST=$(aws ec2 describe-instances \
              --instance-ids "${INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text 2>/dev/null)
          fi

          if [ -z "${HOST}" ] || [ "${HOST}" = "None" ]; then
            echo "::warning::Could not resolve a public hostname or IP for the EC2 instance; the deploy succeeded, but the report will omit the live API link."
            echo "api_url=" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          echo "api_url=http://${HOST}" >> "${GITHUB_OUTPUT}"

      - name: Verify Deployment Health
        id: verify-health
        if: steps.resolve-endpoint.outputs.api_url != ''
        continue-on-error: true
        env:
          API_URL: ${{ steps.resolve-endpoint.outputs.api_url }}
        run: |
          HEALTH_URL="${API_URL}/health"
          BODY=""
          for attempt in $(seq 1 5); do
            BODY=$(curl -fsS "${HEALTH_URL}") && break
            echo "Attempt ${attempt} failed to reach ${HEALTH_URL}, retrying..."
            sleep 3
          done

          if [ -z "${BODY}" ]; then
            echo "::warning::Could not reach ${HEALTH_URL} after 5 attempts; the deploy succeeded, but health could not be verified."
            echo "health_json=unreachable" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          echo "health_json=${BODY}" >> "${GITHUB_OUTPUT}"

          STATUS=$(echo "${BODY}" | jq -r '.status')
          if [ "${STATUS}" != "ok" ]; then
            echo "::warning::Deployed API health check reported status '${STATUS}': ${BODY}"
            exit 1
          fi

  report:
    name: Report
    needs: [validate, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Parse Health Check
        id: parse-health
        env:
          HEALTH_JSON: ${{ needs.deploy.outputs.health_json }}
        run: |
          API_STATUS="n/a"
          DB_STATUS="n/a"

          if [ -n "${HEALTH_JSON}" ] && [ "${HEALTH_JSON}" != "unreachable" ]; then
            API_STATUS=$(echo "${HEALTH_JSON}" | jq -r '.status // "n/a"')
            DB_STATUS=$(echo "${HEALTH_JSON}" | jq -r '.mongo // "n/a"')
          fi

          {
            echo "api_status=${API_STATUS}"
            echo "db_status=${DB_STATUS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Report Deployment
        uses: ./.github/actions/report-workflow
        with:
          title: EC2 Deployment
          status: ${{ (needs.validate.result == 'success' && needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          commit: ${{ github.sha }}
          checks: |
            | Validate | `${{ needs.validate.result }}` |
            | Build and Push | `${{ needs.build-and-push.result }}` |
            | Deploy | `${{ needs.deploy.result }}` |
          health-checks: |
            ${{ needs.deploy.outputs.health_json != '' && format('| API Status | `{0}` |', steps.parse-health.outputs.api_status) || '' }}
            ${{ needs.deploy.outputs.health_json != '' && format('| DB Status | `{0}` |', steps.parse-health.outputs.db_status) || '' }}
          deployment-links: |
            ${{ (needs.deploy.result == 'success' && needs.deploy.outputs.api_url != '') && format('| API Base URL | {0} |', needs.deploy.outputs.api_url) || '' }}
            ${{ (needs.deploy.result == 'success' && needs.deploy.outputs.api_url != '') && format('| Health Check | {0}/health |', needs.deploy.outputs.api_url) || '' }}
            ${{ (needs.deploy.result == 'success' && needs.deploy.outputs.api_url != '') && format('| Documentation | {0}/docs |', needs.deploy.outputs.api_url) || '' }}
          comment-on-pr: "true"
